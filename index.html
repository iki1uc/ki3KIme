<script>
// ================================================================
// IMPERIUM GALACTUM · 756 ACHSEN · 6D · DEEP SPACE
// ================================================================

// ─── STATE ──────────────────────────────────────────────────────
const STATE = {
  achsen: 756,
  dims: [3, 9, 27, 81, 243, 729],
  engine: 0,
  industry: 0,
  markt: 0,
  boerse: 0,
  cycle: 0,
  org: false,
  reorg: false,
  slide: 0,
  wette: 0,
  ds9: false,
  sixD: false,
  ordner: {},
  axiom1: 0,
  axiom2: 0,
  axiom3: 0
};

// ─── ORDNER ─────────────────────────────────────────────────────
const ORDNER = ['3','6','9','API','RUN','boerse','industry','links','markt','rechts','rolle','use','weg'];
ORDNER.forEach(o => STATE.ordner[o] = { active: true, value: 0 });

// ─── CANVAS ─────────────────────────────────────────────────────
const canvas = document.getElementById('galaxyCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width - 20 || 800;
  canvas.height = canvas.width * 0.5625 || 450;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─── RENDER GALAXY ─────────────────────────────────────────────
function renderGalaxy() {
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2;
  const r = Math.min(w, h) * 0.35;

  ctx.clearRect(0, 0, w, h);

  // Hintergrund
  const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, w/2);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.5, '#050510');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 756 Achsen (simuliert)
  const axes = Math.min(756, 200 + STATE.achsen * 0.1);
  for (let i = 0; i < axes; i++) {
    const angle = (i / axes) * Math.PI * 2 + STATE.cycle * 0.001;
    const dist = r * (0.3 + (i / axes) * 0.5);
    const x = cx + Math.cos(angle) * dist;
    const y = cy + Math.sin(angle) * dist;
    const alpha = 0.02 + (i / axes) * 0.04;
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i / axes) * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3-9-27-81-243-729 Ringe
  const dims = STATE.dims;
  const colors = ['#ffd700','#ff4444','#00ccff','#ff66ff','#00ff88','#ff8800'];
  dims.forEach((d, idx) => {
    const rad = r * (0.15 + idx * 0.14);
    ctx.strokeStyle = colors[idx] + '22';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = colors[idx] + '44';
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(d, cx + rad * 0.8, cy - 4);
  });

  // 180° Linie
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([2, 6]);
  ctx.beginPath();
  ctx.moveTo(cx - r, cy);
  ctx.lineTo(cx + r, cy);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#445555';
  ctx.font = '6px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('180° · ERDE', cx, cy + 4);

  // 6D Punkt
  if (STATE.sixD) {
    const angle = STATE.cycle * 0.02;
    const x = cx + Math.cos(angle) * r * 0.6;
    const y = cy + Math.sin(angle) * r * 0.6;
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(x, y, 4 + Math.sin(STATE.cycle * 0.05) * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#00ff8844';
    ctx.font = '6px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('6D', x, y - 6);
  }

  // DS9
  if (STATE.ds9) {
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 40;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', cx, cy - r * 0.5);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd70044';
    ctx.font = '6px monospace';
    ctx.textBaseline = 'top';
    ctx.fillText('DEEP SPACE NINE', cx, cy - r * 0.5 + 14);
  }

  // Engine/Industry/Markt Werte
  ctx.fillStyle = '#445555';
  ctx.font = '6px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`ENGINE: ${STATE.engine}`, 10, h - 20);
  ctx.fillText(`INDUSTRY: ${STATE.industry}`, 10, h - 12);
  ctx.fillText(`MARKT: ${STATE.markt}`, 10, h - 4);

  ctx.textAlign = 'right';
  ctx.fillText(`756 ACHSEN`, w - 10, h - 12);
  ctx.fillText(`ORG: ${STATE.org ? 'ON' : 'OFF'} · REORG: ${STATE.reorg ? 'ON' : 'OFF'}`, w - 10, h - 4);
}

// ─── 6D STEP ────────────────────────────────────────────────────
function sixDStep() {
  STATE.cycle++;
  STATE.sixD = true;

  // 3 → 9 → 27 → 81 → 243 → 729
  const dimIndex = STATE.cycle % STATE.dims.length;
  const dim = STATE.dims[dimIndex];

  // Engine/Industry/Markt
  STATE.engine = (STATE.engine + dim * 0.1) % 1000;
  STATE.industry = (STATE.industry + dim * 0.15) % 1000;
  STATE.markt = (STATE.markt + dim * 0.2) % 1000;
  STATE.boerse = (STATE.boerse + dim * 0.05) % 1000;

  // Axiome
  STATE.axiom1 = (STATE.axiom1 + dim * 0.03) % 100;
  STATE.axiom2 = (STATE.axiom2 + dim * 0.04) % 100;
  STATE.axiom3 = (STATE.axiom3 + dim * 0.05) % 100;

  // Ordner Werte
  ORDNER.forEach((o, idx) => {
    STATE.ordner[o].value = (STATE.ordner[o].value + dim * (0.01 + idx * 0.002)) % 100;
  });

  document.getElementById('engineVal').textContent = Math.round(STATE.engine);
  document.getElementById('industryVal').textContent = Math.round(STATE.industry);
  document.getElementById('marktVal').textContent = Math.round(STATE.markt);

  log(`🌀 6D STEP · ${dim} · Engine: ${Math.round(STATE.engine)} · Industrie: ${Math.round(STATE.industry)} · Markt: ${Math.round(STATE.markt)}`, '6d');
  updateUI();
  renderGalaxy();
}

// ─── DS9 ────────────────────────────────────────────────────────
function toggleDs9() {
  STATE.ds9 = !STATE.ds9;
  log(STATE.ds9 ? '★ DEEP SPACE NINE · aktiviert' : '★ DEEP SPACE NINE · deaktiviert', 'ds9');
  updateUI();
  renderGalaxy();
}

// ─── 756 ACHSEN · FINAL NC ───────────────────────────────────────
function toggleAchsen() {
  const raw = STATE.achsen;          // aktueller Achsenwert
  const dyn = raw * 0.42;            // dynamische Verstärkung
  const limit = Math.min(1500, dyn); // Performance‑Limit
  const smooth = Math.floor(limit);  // Glätten

  STATE.achsen = smooth;

  log(`📐 ACHSEN · ${STATE.achsen}`, 'achse');
  updateUI();
  renderGalaxy();
}


function toggleOrg() {
  STATE.org = !STATE.org;

  if (STATE.org) {
    STATE.reorg = false;
    STATE.ordnerShuffled = null;

    const sorted = [...ORDNER].sort((a, b) =>
      STATE.ordner[a].value - STATE.ordner[b].value
    );

    STATE.ordnerSorted = sorted;
    log(`🔄 ORG · sortiert · ${sorted.join(', ')}`, 'flow');

  } else {
    STATE.ordnerSorted = null;
    log('🔄 ORG · deaktiviert', 'flow');
  }

  updateUI();
}


function toggleReorg() {
  STATE.reorg = !STATE.reorg;

  if (STATE.reorg) {
    STATE.org = false;
    STATE.ordnerSorted = null;

    const shuffled = [...ORDNER];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    STATE.ordnerShuffled = shuffled;
    log(`🔄 REORG · gemischt · ${shuffled.join(', ')}`, 'whirl');

  } else {
    STATE.ordnerShuffled = null;
    log('🔄 REORG · deaktiviert', 'flow');
  }

  updateUI();
}


// ─── SLIDE ──────────────────────────────────────────────────────
function doSlide() {
  STATE.slide++;
  const value = Math.round(10 + Math.random() * 90);
  log(`📊 SLIDE · ${value}% · ${STATE.slide}`, 'flow');
  updateUI();
}

// ─── WETTE · FINAL NC ───────────────────────────────────────────
function doWette() {
  STATE.wette++;

  const value = Math.round(Math.random() * 100);
  const gewinn = value > 50 ? 'gewonnen 🎉' : 'verloren 😅';

  log(`🎲 WETTE · ${value}% · ${gewinn} · ${STATE.wette}`, 'whirl');

  updateUI();
}


// ─── RESET · FINAL NC ───────────────────────────────────────────
function resetAll() {
  Object.assign(STATE, {
    cycle: 0,
    engine: 0,
    industry: 0,
    markt: 0,
    boerse: 0,
    org: false,
    reorg: false,
    slide: 0,
    wette: 0,
    sixD: false,
    ds9: false,
    achsen: 756,
    axiom1: 0,
    axiom2: 0,
    axiom3: 0
  });

  ORDNER.forEach(o => STATE.ordner[o].value = 0);

  ['engineVal','industryVal','marktVal'].forEach(id => {
    document.getElementById(id).textContent = '0';
  });

  log('⟲ RESET · Imperium zurückgesetzt', 'flow');

  updateUI();
  renderGalaxy();
}


// ─── GRUPPEN BILDUNG · FINAL NC ─────────────────────────────────
const GRUPPEN = {
  basis: ['3','6','9'],
  kern: ['API','RUN','boerse'],
  industrie: ['industry','markt','links'],
  system: ['rechts','rolle','use','weg']
};

function connectGruppen() {
  let status = '';

  for (const [name, members] of Object.entries(GRUPPEN)) {
    const aktiv = members.filter(m => STATE.ordner[m]?.value > 30).length;
    const total = members.length;

    const icon =
      aktiv === total ? '🟢' :
      aktiv > 0       ? '🟡' :
                        '🔴';

    status += `${icon} ${name} (${aktiv}/${total}) `;
    log(`🔗 GRUPPE ${name} · ${aktiv}/${total} verbunden`, 'flow');
  }

  const el = document.getElementById('gruppenStatus');
  if (el) el.textContent = status;

  return status;
}


// ─── CONNECT BUTTON · FINAL NC ──────────────────────────────────
document.getElementById('btnConnect').addEventListener('click', () => {
  connectGruppen();
  log('🔗 GRUPPEN · neu verbunden', 'ds9');
  updateUI();
});
